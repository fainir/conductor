name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The plugin runs the committed bundle, so it must match src/.
      - name: dist/ is up to date
        run: git diff --exit-code dist/ || (echo "dist/conductor-mcp.cjs is stale - run 'npm run build' and commit it" && exit 1)
      - run: npm test
